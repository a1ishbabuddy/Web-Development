<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .circle {
        width :300px;
        height:300px;
        background-color: black;
        border-radius:50%;
        margin:100px auto;
        animation:bounce 2 ease-in-out 1s infinite alternate forwards;
    }
    @keyframes bounce{
        0% {transform: translateY(0); background-color: pink;}
        50% {transform: translateY(-150px); background-color: gold;}
        /* 70% {transform: translateY(0); background-color: lightblue;}
        100% {transform: translateX(150); background-color: green;} */
    } 
h3{
    text-align: center;
    font-family:sans-serif;
}
</style>
<body>
    <h3>Animation Example (shorthand)</h3>
    <div class="circle"></div>
</body>
</html>
