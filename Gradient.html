<style>
        .background{
            width: 90%;
            font-size: 2rem;
            overflow: auto;
            height: 50vh;
            background: linear-gradient(to right, rgb(228, 103, 155), rgb(226, 226, 12));
            box-shadow: 0 0 10px rgba(7, 5, 5, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            direction: column;
        }
        .circle{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(to right, rgb(228, 103, 155), rgb(226, 226, 12));
            box-shadow: 0 0 10px rgba(7, 5, 5, 0.9);
            transform:rotate(45deg);
        }
.circle:hover{
    transform:rotate(45eg);
    transition: 1s;
    BACKGROUND: linear-gradient(to right, rgb(228, 103, 155), rgb(226, 226, 12));
}
</style>

<div class="background">
