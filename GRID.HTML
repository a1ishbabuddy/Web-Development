<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<Style>
.container1{
    background-color: aquamarine;
    text-align:center;
    margin: 10px;
}
.container1:nth-child(1){
grid-column: span 3;    
}+

.container1:nth-child(3){
    grid-column: span 2;
    height:200px;
}
.container1:nth-child(4){
    grid-column: span 3;

}
</style>
</head>
<body>
    <div class="box">
    <div class="container1">1</div>
    <div class="container1">2</div>
    <div class="container1">3</div>
    <div class="container1">4</div>
    <!-- <div class="box">5</div> -->
</div>
</body>
</html>
